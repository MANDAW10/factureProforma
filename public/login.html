<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - SEYU RENAISSANCE SARL</title>

  <link rel="icon" href="assets/logo.jpg">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body{
      background:#f4f7fb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-card{
      width: 520px;
      max-width: 100%;
      background:#fff;
      border-radius:18px;
      box-shadow:0 10px 30px rgba(15,23,42,0.08);
      padding:36px;
      align-items: center;  
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px;
    }

    .brand img{
      width:100px;
      height:100px;
      object-fit:contain;
    }

    .brand h1{
      margin:0;
      font-size:26px;
      font-weight:900;
      color:#0f172a;
      line-height:1.1;
    }

    .brand p{
      margin:0;
      color:#64748b;
      font-size:14px;
      margin-top:2px;
    }

    .title{
      font-size:40px;
      font-weight:900;
      margin:14px 0 24px 0;
      color:#0f172a;
      text-align: center;
      text-decoration: underline;
    }

    label{
      font-weight:900;
      color:#0f172a;
      margin-bottom:10px;
    }

    .form-control{
      border-radius:12px;
      padding:14px 14px;
      border:1px solid #d7dee9;
      font-size:16px;
    }

    .btn-login{
      background:#2563eb;
      border:none;
      width:100%;
      padding:14px;
      font-size:18px;
      font-weight:900;
      border-radius:14px;
      margin-top:10px;
    }

    .btn-login:hover{
      background:#1d4ed8;
    }
  </style>
</head>

<body>

  <div class="login-card">
    <!-- <div class="brand">
      <img src="assets/logo.jpg" alt="Logo" onerror="this.style.display='none'">
      <div>
        <h1>SEYU RENAISSANCE SARL</h1>
        <p>Gestion des Factures Proforma</p>
      </div>
    </div> -->

    <div class="title">Connexion</div>

    <div class="mb-3">
      <label>Email</label>
      <input id="email" type="email" class="form-control" placeholder="Mail" />
    </div>

    <div class="mb-3">
      <label>Mot de passe</label>
      <input id="password" type="password" class="form-control" placeholder="••••••••" />
    </div>

    <button id="loginBtn" class="btn btn-primary btn-login">Se connecter</button>

    <div id="msg" class="mt-3"></div>
  </div>

  <script>
    // ✅ Si déjà connecté, on redirige vers index
    if (sessionStorage.getItem("token")) {
      window.location.href = "index.html";
    }

    const loginBtn = document.getElementById("loginBtn");
    const msg = document.getElementById("msg");

    async function doLogin() {
      msg.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        msg.innerHTML = `<div class="alert alert-danger">❌ Email et mot de passe obligatoires</div>`;
        return;
      }

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const json = await res.json();

        if (!res.ok) {
          msg.innerHTML = `<div class="alert alert-danger">❌ ${json.error || "Erreur login"}</div>`;
          return;
        }

        // ✅ IMPORTANT : sessionStorage (pas localStorage)
        sessionStorage.setItem("token", json.token);

        msg.innerHTML = `<div class="alert alert-success">✅ Connexion réussie</div>`;

        // ✅ redirection vers index
        setTimeout(() => {
          window.location.href = "index.html";
        }, 300);

      } catch (e) {
        console.error(e);
        msg.innerHTML = `<div class="alert alert-danger">❌ Erreur serveur login</div>`;
      }
    }

    loginBtn.addEventListener("click", doLogin);

    // ✅ Entrée clavier (Enter)
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>

</body>
</html>
