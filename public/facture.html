<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouvelle Facture Proforma</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body{
      background:#f4f7fb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .topbar{
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      padding:18px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand img{
      width:100px;
      height:100px;
      object-fit:contain;
    }

    .brand-title{
      font-size:28px;
      font-weight:900;
      margin:0;
      line-height:1.1;
      color:#0f172a;
    }

    .brand-sub{
      margin:0;
      margin-top:3px;
      color:#64748b;
      font-size:14px;
    }

    .btn-light-pro{
      background:#e5e7eb;
      border:none;
      color:#0f172a;
      font-weight:900;
      padding:12px 18px;
      border-radius:12px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-light-pro:hover{ background:#dfe3ea; }

    .btn-primary-pro{
      background:#2563eb;
      border:none;
      color:white;
      font-weight:900;
      padding:12px 18px;
      border-radius:12px;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-primary-pro:hover{ background:#1d4ed8; }

    .btn-logout{
      background:#111827;
      border:none;
      color:white;
      font-weight:900;
      padding:12px 18px;
      border-radius:12px;
    }
    .btn-logout:hover{ background:#0b1220; }

    .page-wrap{ padding:32px 0; }

    .card-pro{
      background:#fff;
      border-radius:18px;
      border:0;
      box-shadow:0 10px 30px rgba(15,23,42,0.08);
      padding:42px;
    }

    .page-title{
      font-size:46px;
      font-weight:900;
      color:#0f172a;
      margin-bottom:26px;
    }

    label{
      font-weight:900;
      color:#0f172a;
      margin-bottom:10px;
    }

    .form-control, .form-select{
      border-radius:12px;
      padding:14px 14px;
      border:1px solid #d7dee9;
      font-size:16px;
    }

    .btn-add-client{
      width:64px;
      height:54px;
      border-radius:12px;
      font-size:28px;
      font-weight:900;
      background:#16a34a;
      border:none;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .btn-add-client:hover{
      background:#15803d;
    }

    .section-title{
      font-size:32px;
      font-weight:900;
      margin-top:30px;
      margin-bottom:18px;
      color:#0f172a;
    }

    .btn-add-item{
      background:#2563eb;
      border:none;
      color:white;
      font-weight:900;
      padding:12px 18px;
      border-radius:14px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      font-size:18px;
    }
    .btn-add-item:hover{
      background:#1d4ed8;
    }

    .items-head{
      color:#334155;
      font-weight:900;
      padding:10px 0;
    }

    .item-row{
      border-top:1px solid #e7edf5;
      padding-top:16px;
      padding-bottom:16px;
    }

    .btn-del{
      width:44px;
      height:44px;
      border-radius:10px;
      border:0;
      background:#ef4444;
      color:white;
      font-weight:900;
    }
    .btn-del:hover{
      background:#dc2626;
    }

    .totals-box{
      background:#fff;
      border-radius:16px;
      box-shadow:0 8px 18px rgba(15,23,42,0.06);
      padding:24px 26px;
    }

    .totals-line{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:20px;
      color:#0f172a;
      margin-bottom:14px;
    }

    .totals-line .value{ font-weight:900; }

    .totals-sep{
      height:1px;
      background:#e5e7eb;
      margin:18px 0;
    }

    .total-final{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:28px;
      font-weight:900;
      color:#0f172a;
      margin-top:8px;
    }

    .btn-create{
      background:#2563eb;
      border:none;
      font-weight:900;
      border-radius:16px;
      padding:18px 26px;
      font-size:20px;
      color:white;
      width:260px;
    }
    .btn-create:hover{
      background:#1d4ed8;
    }

    .result-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
  </style>
</head>

<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
      <div class="brand">
        <img src="assets/logo.jpg" alt="Logo" onerror="this.style.display='none'">
        <div>
          <h1 class="brand-title">SEYU RENAISSANCE SARL</h1>
          <p class="brand-sub">Gestion des Factures Proforma</p>
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <a href="index.html" class="btn-light-pro">☰ Liste des factures</a>
        <a href="facture.html" class="btn-primary-pro">＋ Nouvelle facture</a>
        <button id="logoutBtn" class="btn-logout">⏻ Déconnexion</button>
      </div>
    </div>
  </div>

  <!-- PAGE -->
  <div class="page-wrap">
    <div class="container">
      <div class="card-pro">

        <div class="page-title">Nouvelle Facture Proforma</div>

        <!-- HEADER FORM -->
        <div class="row g-4 align-items-end">
          <div class="col-lg-6">
            <label>Client *</label>
            <div class="d-flex gap-2">
              <select id="clientSelect" class="form-select">
                <option value="">Chargement des clients...</option>
              </select>

              <button id="openClientModalBtn" class="btn-add-client" type="button" title="Ajouter client">+</button>
            </div>
          </div>

          <div class="col-lg-3">
            <label>Date d'émission *</label>
            <input id="issueDate" type="date" class="form-control"/>
          </div>

          <div class="col-lg-3">
            <label>Date d'échéance</label>
            <input id="dueDate" type="date" class="form-control"/>
          </div>
        </div>

        <!-- ITEMS -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div class="section-title">Articles</div>
          <button id="addItemBtn" class="btn-add-item" type="button">＋ Ajouter un article</button>
        </div>

        <div class="mt-2">
          <div class="row items-head">
            <div class="col-lg-4">Description</div>
            <div class="col-lg-2">Qté</div>
            <div class="col-lg-2">Prix</div>
            <div class="col-lg-2">Unité</div>
            <div class="col-lg-1">Total</div>
            <div class="col-lg-1 text-end"></div>
          </div>

          <div id="itemsContainer"></div>
        </div>

        <!-- NOTES + TVA + TOTALS -->
        <div class="row g-4 mt-4">
          <div class="col-lg-6">
            <label>Notes</label>
            <textarea id="notes" class="form-control" rows="5" placeholder="Notes additionnelles..."></textarea>
          </div>

          <div class="col-lg-2">
            <label>Taux de TVA (%)</label>
            <input id="tvaRate" type="number" class="form-control" value="18" />
          </div>

          <div class="col-lg-4">
            <div class="totals-box">
              <div class="totals-line">
                <span>Sous-total:</span>
                <span class="value" id="subtotalText">0 FCFA</span>
              </div>

              <div class="totals-line">
                <span>TVA (<span id="tvaLabel">18</span>%):</span>
                <span class="value" id="tvaText">0 FCFA</span>
              </div>

              <div class="totals-sep"></div>

              <div class="total-final">
                <span>Total:</span>
                <span id="totalText">0 FCFA</span>
              </div>
            </div>
          </div>
        </div>

        <!-- CREATE -->
        <div class="d-flex justify-content-end mt-4">
          <button id="createBtn" class="btn-create" type="button">Créer la facture</button>
        </div>

        <div class="mt-4" id="result"></div>

      </div>
    </div>
  </div>

  <!-- MODAL ADD CLIENT -->
  <div class="modal fade" id="clientModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:16px;">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Ajouter un client</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-bold">Nom *</label>
            <input id="newClientName" class="form-control" placeholder="Ex: Mandaw" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Téléphone</label>
            <input id="newClientPhone" class="form-control" placeholder="Ex: 77 000 00 00" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Email</label>
            <input id="newClientEmail" class="form-control" placeholder="Ex: contact@email.com" />
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Adresse</label>
            <input id="newClientAddress" class="form-control" placeholder="Ex: Dakar, Sénégal" />
          </div>

          <div id="clientModalMsg"></div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
          <button id="saveClientBtn" class="btn btn-primary">✅ Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ==========================================================
       ✅ AUTH SESSION
    ========================================================== */
    function getToken() {
      return sessionStorage.getItem("token");
    }

    function forceLogout() {
      sessionStorage.removeItem("token");
      window.location.href = "login.html";
    }

    if (!getToken()) {
      window.location.href = "login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", forceLogout);

    /* ==========================================================
       ✅ PDF (VIEW / DOWNLOAD / PRINT) via fetch + blob
    ========================================================== */
    async function fetchPdfBlob(invoiceId) {
      const res = await fetch(`/api/invoices/${invoiceId}/pdf`, {
        headers: { Authorization: "Bearer " + getToken() }
      });

      if (res.status === 401) {
        forceLogout();
        return null;
      }

      if (!res.ok) {
        alert("❌ Erreur PDF");
        return null;
      }

      return await res.blob();
    }

    async function openPdf(invoiceId) {
      const blob = await fetchPdfBlob(invoiceId);
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    }

    async function downloadPdf(invoiceId, invoiceNumber) {
      const blob = await fetchPdfBlob(invoiceId);
      if (!blob) return;

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${invoiceNumber}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    async function printPdf(invoiceId) {
      const blob = await fetchPdfBlob(invoiceId);
      if (!blob) return;

      const url = URL.createObjectURL(blob);
      const w = window.open(url, "_blank");
      w.onload = () => {
        w.focus();
        w.print();
      };
    }

    /* ==========================================================
       ✅ ITEMS / TOTALS
    ========================================================== */
    const itemsContainer = document.getElementById("itemsContainer");

    function formatFCFA(n){
      return Number(n || 0).toLocaleString("fr-FR") + " FCFA";
    }

    function calcTotals(){
      let subtotal = 0;

      document.querySelectorAll("#itemsContainer .item-row").forEach(row => {
        const qty = Number(row.querySelector(".qty").value || 0);
        const price = Number(row.querySelector(".price").value || 0);
        subtotal += qty * price;
      });

      const rate = Number(document.getElementById("tvaRate").value || 0);
      document.getElementById("tvaLabel").textContent = rate;

      const tva = subtotal * (rate / 100);
      const total = subtotal + tva;

      document.getElementById("subtotalText").textContent = formatFCFA(subtotal);
      document.getElementById("tvaText").textContent = formatFCFA(tva);
      document.getElementById("totalText").textContent = formatFCFA(total);
    }

    function createItemRow(){
      const row = document.createElement("div");
      row.className = "row g-3 align-items-center item-row";

      row.innerHTML = `
        <div class="col-lg-4">
          <input type="text" class="form-control desc" placeholder="Ex: Briques" />
        </div>
        <div class="col-lg-2">
          <input type="number" class="form-control qty" value="1" min="0" />
        </div>
        <div class="col-lg-2">
          <input type="number" class="form-control price" value="0" min="0" />
        </div>
        <div class="col-lg-2">
          <input type="text" class="form-control unit" value="FCFA" />
        </div>
        <div class="col-lg-1">
          <div class="fw-bold totalLine">0</div>
        </div>
        <div class="col-lg-1 text-end">
          <button class="btn-del" type="button">X</button>
        </div>
      `;

      const qty = row.querySelector(".qty");
      const price = row.querySelector(".price");
      const del = row.querySelector(".btn-del");

      function recalc(){
        const line = Number(qty.value || 0) * Number(price.value || 0);
        row.querySelector(".totalLine").textContent = line.toLocaleString("fr-FR");
        calcTotals();
      }

      qty.addEventListener("input", recalc);
      price.addEventListener("input", recalc);

      del.addEventListener("click", () => {
        row.remove();
        calcTotals();
      });

      recalc();
      return row;
    }

    document.getElementById("addItemBtn").addEventListener("click", () => {
      itemsContainer.appendChild(createItemRow());
      calcTotals();
    });

    document.getElementById("tvaRate").addEventListener("input", calcTotals);

    function setDefaultDates(){
      const today = new Date().toISOString().slice(0,10);
      document.getElementById("issueDate").value = today;
    }

    /* ==========================================================
       ✅ CLIENTS API
    ========================================================== */
    async function loadClientsFromAPI(selectedId = null){
      const select = document.getElementById("clientSelect");
      select.innerHTML = `<option value="">Sélectionner un client</option>`;

      try {
        const res = await fetch("/api/clients", {
          headers: { Authorization: "Bearer " + getToken() }
        });

        if (res.status === 401) return forceLogout();

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Erreur chargement clients");
          return;
        }

        data.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.name;
          select.appendChild(opt);
        });

        if (selectedId) select.value = selectedId;

      } catch (err) {
        console.error(err);
        select.innerHTML = `<option value="">❌ Impossible de charger les clients</option>`;
      }
    }

    /* ==========================================================
       ✅ MODAL AJOUT CLIENT
    ========================================================== */
    document.getElementById("openClientModalBtn").addEventListener("click", () => {
      const modal = new bootstrap.Modal(document.getElementById("clientModal"));

      document.getElementById("clientModalMsg").innerHTML = "";
      document.getElementById("newClientName").value = "";
      document.getElementById("newClientPhone").value = "";
      document.getElementById("newClientEmail").value = "";
      document.getElementById("newClientAddress").value = "";

      modal.show();
    });

    document.getElementById("saveClientBtn").addEventListener("click", async () => {
      const name = document.getElementById("newClientName").value.trim();
      const phone = document.getElementById("newClientPhone").value.trim();
      const email = document.getElementById("newClientEmail").value.trim();
      const address = document.getElementById("newClientAddress").value.trim();

      if (!name) {
        document.getElementById("clientModalMsg").innerHTML =
          `<div class="alert alert-danger mt-2">❌ Le nom est obligatoire</div>`;
        return;
      }

      try {
        const res = await fetch("/api/clients", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + getToken()
          },
          body: JSON.stringify({ name, phone, email, address })
        });

        if (res.status === 401) return forceLogout();

        const json = await res.json();

        if (!res.ok){
          document.getElementById("clientModalMsg").innerHTML =
            `<div class="alert alert-danger mt-2">❌ ${json.error || "Erreur ajout client"}</div>`;
          return;
        }

        document.getElementById("clientModalMsg").innerHTML =
          `<div class="alert alert-success mt-2">✅ Client ajouté</div>`;

        await loadClientsFromAPI();

        setTimeout(() => {
          bootstrap.Modal.getInstance(document.getElementById("clientModal")).hide();
        }, 700);

      } catch (err) {
        console.error(err);
        document.getElementById("clientModalMsg").innerHTML =
          `<div class="alert alert-danger mt-2">❌ Erreur serveur</div>`;
      }
    });

    /* ==========================================================
       ✅ CREATE INVOICE
    ========================================================== */
    document.getElementById("createBtn").addEventListener("click", async () => {
      const client_id = document.getElementById("clientSelect").value;
      const issue_date = document.getElementById("issueDate").value;
      const due_date = document.getElementById("dueDate").value;
      const notes = document.getElementById("notes").value;
      const tva_rate = document.getElementById("tvaRate").value;

      const items = [];
      document.querySelectorAll("#itemsContainer .item-row").forEach(row => {
        items.push({
          description: row.querySelector(".desc").value,
          quantity: row.querySelector(".qty").value,
          unit_price: row.querySelector(".price").value,
          unit: row.querySelector(".unit").value
        });
      });

      if (!client_id) return alert("Veuillez sélectionner un client.");
      if (!issue_date) return alert("Veuillez choisir la date d'émission.");
      if (!items.length) return alert("Ajoutez au moins un article.");

      try {
        const res = await fetch("/api/invoices", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + getToken()
          },
          body: JSON.stringify({ client_id, issue_date, due_date, notes, tva_rate, items })
        });

        if (res.status === 401) return forceLogout();

        const json = await res.json();

        if (!res.ok){
          alert(json.error || "Erreur création facture");
          return;
        }

        // ✅ RESULT WITH WORKING BUTTONS
        document.getElementById("result").innerHTML = `
          <div class="alert alert-success">
            ✅ Facture créée : <b>${json.invoiceNumber}</b>
            <div class="result-actions">
              <button class="btn btn-outline-dark" onclick="openPdf(${json.invoiceId})">👁️ Voir PDF</button>
              <button class="btn btn-primary" onclick="downloadPdf(${json.invoiceId}, '${json.invoiceNumber}')">⬇️ Télécharger</button>
              <button class="btn btn-success" onclick="printPdf(${json.invoiceId})">🖨️ Imprimer</button>
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        alert("Erreur serveur / API");
      }
    });

    /* ==========================================================
       ✅ INIT
    ========================================================== */
    loadClientsFromAPI();
    setDefaultDates();
    itemsContainer.appendChild(createItemRow());
    calcTotals();
  </script>

</body>
</html>
