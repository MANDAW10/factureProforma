<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEYU RENAISSANCE SARL - Liste des factures</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#f5f7fb; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .topbar { background:#fff; border-bottom:1px solid #e5e7eb; padding:18px 0; position:sticky; top:0; z-index:10; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand img { width:100px; height:100px; object-fit:contain; }
    .brand-title { font-size:28px; font-weight:900; margin:0; color:#0f172a; }
    .brand-sub { margin:0; color:#6b7280; font-size:14px; margin-top:3px; }

    .btn-soft { border:0; background:#e8eefc; color:#1e3a8a; font-weight:800; padding:10px 18px; border-radius:12px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .btn-soft:hover { background:#dbe6ff; }

    .btn-primary-pro { background:#2563eb; border:0; font-weight:900; padding:10px 18px; border-radius:12px; color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
    .btn-primary-pro:hover { background:#1d4ed8; }

    .btn-logout { background:#111827; border:0; font-weight:900; padding:10px 18px; border-radius:12px; color:white; }
    .btn-logout:hover { background:#0b1220; }

    .card-pro { background:white; border:0; border-radius:16px; box-shadow:0 10px 25px rgba(15,23,42,0.06); overflow:hidden; }
    .wrap { padding:28px 0; }

    .searchbar { border-radius:12px; padding:10px 14px; border:1px solid #e5e7eb; outline:none; }
    .searchbar:focus { border-color:#2563eb; box-shadow:0 0 0 4px rgba(37,99,235,0.1); }

    .table thead th { color:#64748b; font-weight:900; border-bottom:1px solid #e5e7eb; padding:18px 16px; }
    .table tbody td { padding:18px 16px; border-bottom:1px solid #eef2f7; vertical-align:middle; font-size:15px; }

    .badge-draft { background:#f3f4f6; color:#111827; border-radius:999px; padding:8px 12px; font-weight:900; font-size:13px; }

    .btn-action { border:0; padding:9px 12px; border-radius:12px; font-weight:900; display:inline-flex; align-items:center; gap:7px; margin-left:6px; }
    .btn-view { background:#2563eb; color:#fff; }
    .btn-view:hover { background:#1d4ed8; }
    .btn-download { background:#0ea5e9; color:#fff; }
    .btn-download:hover { background:#0284c7; }
    .btn-print { background:#16a34a; color:#fff; }
    .btn-print:hover { background:#15803d; }
    .btn-delete { background:#ef4444; color:#fff; }
    .btn-delete:hover { background:#dc2626; }

    .pagination-box { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-top:1px solid #eef2f7; background:#fff; }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="container d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <div class="brand">
        <img src="assets/logo.jpg" alt="Logo" onerror="this.style.display='none'">
        <div>
          <h1 class="brand-title">SEYU RENAISSANCE SARL</h1>
          <p class="brand-sub">Gestion des Factures Proforma</p>
        </div>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <a href="index.html" class="btn-primary-pro">☰ Liste des factures</a>
        <a href="facture.html" class="btn-soft">➕ Nouvelle facture</a>
        <button id="logoutBtn" class="btn-logout">⏻ Déconnexion</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="container">

      <div class="card-pro">
        <div class="p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="fw-bold text-muted">Historique (10 factures par page)</div>
          <input id="searchInput" class="searchbar" style="min-width:260px" placeholder="Rechercher facture ou client..." />
        </div>

        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th>N° Facture</th>
                <th>Client</th>
                <th>Date</th>
                <th>Montant</th>
                <th>Statut</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="invoiceTable">
              <tr>
                <td colspan="6" class="text-center text-muted py-5">Chargement des factures...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-box">
          <div class="text-muted fw-semibold" id="pageInfo">Page 1 / 1</div>
          <div class="d-flex gap-2">
            <button id="prevBtn" class="btn btn-outline-secondary btn-sm">⬅️ Précédent</button>
            <button id="nextBtn" class="btn btn-outline-secondary btn-sm">Suivant ➡️</button>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
  // ✅ SESSION AUTH
  function getToken() {
    return sessionStorage.getItem("token");
  }
  function forceLogout() {
    sessionStorage.removeItem("token");
    window.location.href = "login.html";
  }
  if (!getToken()) window.location.href = "login.html";

  document.getElementById("logoutBtn").addEventListener("click", forceLogout);

  let invoicesCache = [];
  let filteredCache = [];
  let currentPage = 1;
  const pageSize = 10;

  function formatFCFA(n){
    return Number(n || 0).toLocaleString("fr-FR") + " FCFA";
  }

  function getTotalPages(list){
    return Math.max(1, Math.ceil(list.length / pageSize));
  }

  async function fetchPdfBlob(invoiceId){
    const res = await fetch(`/api/invoices/${invoiceId}/pdf`, {
      headers: { Authorization: "Bearer " + getToken() }
    });

    if (res.status === 401) {
      forceLogout();
      return null;
    }
    if (!res.ok) {
      alert("❌ Erreur chargement PDF");
      return null;
    }

    return await res.blob();
  }

  async function openPdf(invoiceId){
    const blob = await fetchPdfBlob(invoiceId);
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
  }

  async function downloadPdf(invoiceId, invoiceNumber){
    const blob = await fetchPdfBlob(invoiceId);
    if(!blob) return;

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${invoiceNumber}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function printPdf(invoiceId){
    const blob = await fetchPdfBlob(invoiceId);
    if(!blob) return;

    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    w.onload = () => {
      w.focus();
      w.print();
    };
  }

  function renderInvoices(list){
    const tbody = document.getElementById("invoiceTable");
    const totalPages = getTotalPages(list);

    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * pageSize;
    const pageData = list.slice(start, start + pageSize);

    if(!pageData.length){
      tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-5">Aucune facture trouvée</td></tr>`;
    } else {
      tbody.innerHTML = "";
      pageData.forEach(inv => {
        tbody.innerHTML += `
          <tr>
            <td style="font-weight:900">${inv.invoice_number}</td>
            <td>${inv.client_name || "-"}</td>
            <td>${inv.issue_date || "-"}</td>
            <td style="font-weight:900">${formatFCFA(inv.total)}</td>
            <td><span class="badge-draft">Brouillon</span></td>
            <td class="text-end">
                <button class="btn-action btn-view" onclick="openPdf(${inv.id})">👁️ Voir</button>
                                <button class="btn-action btn-download" onclick="downloadPdf(${inv.id}, '${inv.invoice_number}')">⬇️ Télécharger</button>
                <button class="btn-action btn-delete" onclick="deleteInvoice(${inv.id}, '${inv.invoice_number}')">🗑️ Supprimer</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById("pageInfo").textContent = `Page ${currentPage} / ${totalPages}`;
    document.getElementById("prevBtn").disabled = currentPage <= 1;
    document.getElementById("nextBtn").disabled = currentPage >= totalPages;
  }

  async function loadInvoices(){
    const res = await fetch("/api/invoices", {
      headers: { Authorization: "Bearer " + getToken() }
    });

    if (res.status === 401) return forceLogout();

    const data = await res.json();
    if(!res.ok){
      alert(data.error || "Erreur chargement factures");
      return;
    }

    invoicesCache = data;
    filteredCache = data;
    currentPage = 1;
    renderInvoices(filteredCache);
  }

  async function deleteInvoice(id, invoiceNumber){
    if(!confirm(`Supprimer la facture ${invoiceNumber} ?`)) return;

    const res = await fetch(`/api/invoices/${id}`, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + getToken() }
    });

    if (res.status === 401) return forceLogout();

    const json = await res.json();
    if(!res.ok){
      alert(json.error || "Erreur suppression");
      return;
    }

    loadInvoices();
  }

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    const q = e.target.value.toLowerCase();
    filteredCache = invoicesCache.filter(inv =>
      String(inv.invoice_number || "").toLowerCase().includes(q) ||
      String(inv.client_name || "").toLowerCase().includes(q)
    );
    currentPage = 1;
    renderInvoices(filteredCache);
  });

  document.getElementById("prevBtn").addEventListener("click", ()=>{
    currentPage--;
    renderInvoices(filteredCache);
  });

  document.getElementById("nextBtn").addEventListener("click", ()=>{
    currentPage++;
    renderInvoices(filteredCache);
  });

  loadInvoices();
</script>

</body>
</html>
